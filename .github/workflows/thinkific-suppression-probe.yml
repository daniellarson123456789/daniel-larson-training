name: Thinkific suppression capability probe

on:
  workflow_dispatch:
  push:
    branches: [codex/thinkific-enrollment-capability]
    paths: [.github/workflows/thinkific-suppression-probe.yml]

permissions:
  contents: read

concurrency:
  group: thinkific-suppression-capability-probe
  cancel-in-progress: false

jobs:
  read-enrollment-capability:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/thinkific-enrollment-capability'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run synthetic safety checks
        run: node --test automation/thinkific-suppression-probe/probe.test.mjs
      - name: Probe one enrollment page without customer output
        env:
          THINKIFIC_API_TOKEN: ${{ secrets.THINKIFIC_API_TOKEN }}
        run: node automation/thinkific-suppression-probe/probe.mjs
