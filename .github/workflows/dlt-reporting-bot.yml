name: DLT reporting bot

on:
  push:
    branches: [main]
    paths:
      - "automation/dlt-reporting-bot/**"
      - ".github/workflows/dlt-reporting-bot.yml"
  workflow_dispatch:
    inputs:
      test_email:
        description: "Send a test email only (never contact DBPR)"
        required: true
        default: false
        type: boolean
      production:
        description: "Submit verified records to DBPR"
        required: true
        default: false
        type: boolean
  schedule:
    # Check for new course completions every 10 minutes.
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: dlt-reporting-bot
  cancel-in-progress: false

jobs:
  test-email:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: automation/dlt-reporting-bot
    env:
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      ADMIN_EMAIL: daniel@daniellarsontraining.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/dlt-reporting-bot/package-lock.json
      - run: npm ci
      - run: npm run test:email

  report:
    if: ${{ (github.event_name != 'schedule' || vars.DLT_REPORTING_BOT_ENABLED == 'true') && (github.event_name != 'workflow_dispatch' || !inputs.test_email) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation/dlt-reporting-bot
    env:
      THINKIFIC_API_TOKEN: ${{ secrets.THINKIFIC_API_TOKEN }}
      DBPR_USERNAME: ${{ secrets.DBPR_USERNAME }}
      DBPR_PASSWORD: ${{ secrets.DBPR_PASSWORD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      ADMIN_EMAIL: daniel@daniellarsontraining.com
      LEDGER_HMAC_KEY: ${{ secrets.LEDGER_HMAC_KEY }}
      LEDGER_PATH: .state/processed.json
      LEDGER_REQUIRED: "true"
      REPORTING_REQUESTED: ${{ github.event_name == 'schedule' || inputs.production == true }}
      REPORTING_ENABLED: ${{ (github.event_name == 'schedule' || inputs.production) && secrets.REPORTING_ENABLED || 'DRY_RUN' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/dlt-reporting-bot/package-lock.json
      - uses: actions/cache/restore@v4
        with:
          path: automation/dlt-reporting-bot/.state
          key: dlt-reporting-ledger-${{ github.run_id }}
          restore-keys: dlt-reporting-ledger-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: mkdir -p .state
      - run: npm run run
      - name: Read-only Thinkific timeout diagnostics
        if: ${{ failure() && github.event_name == 'push' }}
        run: node src/thinkific-diagnostics.js
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: automation/dlt-reporting-bot/.state
          key: dlt-reporting-ledger-${{ github.run_id }}
