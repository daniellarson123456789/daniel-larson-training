name: DLT reporting bot

on:
  workflow_dispatch:
    inputs:
      production:
        description: "Submit verified records to DBPR"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: dlt-reporting-bot
  cancel-in-progress: false

jobs:
  report:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.DLT_REPORTING_BOT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: automation/dlt-reporting-bot
    env:
      THINKIFIC_API_TOKEN: ${{ secrets.THINKIFIC_API_TOKEN }}
      DBPR_USERNAME: ${{ secrets.DBPR_USERNAME }}
      DBPR_PASSWORD: ${{ secrets.DBPR_PASSWORD }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      ADMIN_EMAIL: daniel@daniellarsontraining.com
      LEDGER_HMAC_KEY: ${{ secrets.LEDGER_HMAC_KEY }}
      LEDGER_PATH: .state/processed.json
      REPORTING_ENABLED: ${{ (github.event_name == 'schedule' || inputs.production) && secrets.REPORTING_ENABLED || 'DRY_RUN' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automation/dlt-reporting-bot/package-lock.json
      - uses: actions/cache/restore@v4
        with:
          path: automation/dlt-reporting-bot/.state
          key: dlt-reporting-ledger-${{ github.run_id }}
          restore-keys: dlt-reporting-ledger-
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run run
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: automation/dlt-reporting-bot/.state
          key: dlt-reporting-ledger-${{ github.run_id }}
